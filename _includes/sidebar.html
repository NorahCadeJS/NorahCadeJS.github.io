<aside class="sidebar card">
  <img src="{{ site.author.avatar | relative_url }}" alt="{{ site.author.name }}" class="avatar small">

  <h2>{{ site.author.name }}</h2>
  <p>{{ site.author.bio }}</p>
  <p class="muted">{{ site.author.location }}</p>

  <div class="author-links">
    {% if site.author.email %}
      <a class="author-link-button" href="mailto:{{ site.author.email }}">
        <i class="fa-solid fa-envelope"></i>
        <span>Email</span>
      </a>
    {% endif %}

    {% if site.author.github %}
      <a class="author-link-button" href="{{ site.author.github }}" target="_blank" rel="noopener">
        <i class="fa-brands fa-github"></i>
        <span>GitHub</span>
      </a>
    {% endif %}

    {% if site.author.linkedin %}
      <a class="author-link-button" href="{{ site.author.linkedin }}" target="_blank" rel="noopener">
        <i class="fa-brands fa-linkedin"></i>
        <span>LinkedIn</span>
      </a>
    {% endif %}

    {% if site.author.google_scholar %}
      <a class="author-link-button" href="{{ site.author.google_scholar }}" target="_blank" rel="noopener">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>Google Scholar</span>
      </a>
    {% endif %}
  </div>
</aside>
